name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm run build:dir
      - run: npm run release:checksums
      - name: Verify packaged mutable data remains seed-only
        shell: pwsh
        run: npx asar list "dist/win-unpacked/resources/app.asar" | Select-String "data/users.json"

  release-setup:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build:setup
      - run: npm run release:checksums
      - name: Verify Setup checksum entry
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -File -Filter 'FANUC-Pro-Suite-Read-Only-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS Setup dosyası oluşturulmadı.' }
          $expected = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          $entry = Get-Content dist/SHA256SUMS.txt | Where-Object { $_ -match [regex]::Escape($setup.Name) } | Select-Object -First 1
          if (-not $entry -or -not $entry.StartsWith($expected)) { throw 'Setup SHA-256 doğrulaması başarısız.' }
      - uses: actions/upload-artifact@v4
        with:
          name: fanuc-pro-suite-setup-${{ github.ref_name }}
          path: |
            dist/FANUC-Pro-Suite-Read-Only-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
